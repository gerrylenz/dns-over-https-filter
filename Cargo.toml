[package]
name = "dns-server"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
arc-swap = "1"
base64 = "0.22"
bytes = "1"
chrono = "0.4"
getrandom = "0.2"
hickory-proto = "0.26"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["http1", "http2", "server-auto", "tokio"] }
idna = "1"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.5"
subtle = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = "0.26"
toml = "0.8"
ureq = "2"
webpki-roots = "0.26"

[profile.release]
lto = "thin"
codegen-units = 16
